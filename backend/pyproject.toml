[project]
name = "polis-backend"
version = "0.1.0"
description = "Political OS - Plataforma de inteligência política"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.12",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.1",
    "geoalchemy2>=0.15.0",
    "shapely>=2.0.6",
    "pgvector>=0.3.0",
    "openai>=1.55.0",
    "anthropic>=0.47.0",
    "boto3>=1.36.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.backends._legacy:_Backend"
